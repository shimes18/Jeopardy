<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');   
            body{
                background-color: blue;
                color:white;
                font-family: 'Montserrat', sans-serif;

            }
            #finalanswer , #finalsubmit , #didntload{
                display:none;
            }
            #temphide{
                display:flex;
                align-items: center;
                justify-content: center;
                margin-top:30vh;
                font-size: 30px;
                flex-direction: column;
            }
            
            #changerequest{
                display:none;
            }
            button{
                background-color: whitesmoke;
                color: blue;
                border-radius: 4px;
                border-width: 2px;
                border-color: whitesmoke;
                margin-top: 10px;
                height: 30px;
                width:100px;
                font-size:15px;
                transition: all 0.1s ease-in-out;
                box-shadow: none;
            }

            button:hover{
                background-color: blue;
                color: whitesmoke;
                transform: scale(1.1);
                border-color: whitesmoke;
            }

            #question{
                background-color: black;
                width: 90vw;
            }
            #image{
                height: 200px;
                display:none;
            }

            #describe{
                font-size: 10px;
            }
            #turn{
                text-align: center;
                color: gold;
                font-size : 30px;
            }
            #answerreveal{
                color: pink ;
                text-align:center;
                font-size: 20px;
            }
            #verdict{
                color:gold;
                font-size: 30px;
                text-align:center;
                margin-top: 80px;
                text-shadow: 0 0 10px gold , 0 0 20px gold , 0 0 40px gold ;
            }
            #verdictbalance{
                margin-top: 40px;
                display:flex;
                justify-content: space-evenly;
                font-size: 15px;
            }
        </style>
    </head>
    <body>
        <div id="turn"></div>
        <div id="temphide">
            <div id="onlyone">PLEASE ONLY PLAYER ONE LOOK AT THE SCREEN!!</div>
            <button id="ok" onclick="okay()">Okay</button>
            <div id="finalcategory"></div>
            <img id="image">
            <div id="question"></div><br>
            <div id="describe"></div>
            <input id="finalanswer">
            <button id="finalsubmit" onclick="finalsubmit()">SUBMIT</button>
            <button id="didntload" onclick="didntload()">Didnt load</button>

        </div>
        <div id="changerequest">
            <div id="change">OTHER PLAYER TURN NOW!!</div>
            <button id="changed" onclick="changed()">OKAY</button>
        </div>
        <div id="answerreveal"></div>
        <div id="verdict"></div>
        <div id="verdictbalance"><div id='vb1'></div><div id='vb2'></div></div>
        <button id="home" href="index.html"></button>
        <script src="https://cdn.jsdelivr.net/npm/fuzzball@2.2.6/dist/fuzzball.umd.min.js"></script>
        <script type="text/javascript" src="script1.js" async defer></script>
    </body>
</html>
