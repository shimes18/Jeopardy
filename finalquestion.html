<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');   
            body{
                background-color: blue;
                color:white;
                font-family: 'Montserrat', sans-serif;

            }
            #finalanswer , #finalsubmit{
                display:none;
            }
            #temphide{
                display:flex;
                align-items: center;
                justify-content: center;
                margin-top:30vh;
                font-size: 30px;
                flex-direction: column;
            }
            
            #changerequest{
                display:none;
            }
            button{
                background-color: whitesmoke;
                color: blue;
                border-radius: 4px;
                border-width: 2px;
                border-color: whitesmoke;
                margin-top: 10px;
                height: 30px;
                width:100px;
                font-size:15px;
                transition: all 0.1s ease-in-out;
                box-shadow: none;
            }

            button:hover{
                background-color: blue;
                color: whitesmoke;
                transform: scale(1.1);
                border-color: whitesmoke;
            }

        </style>
    </head>
    <body>
        <div id="temphide">
            <div id="onlyone">PLEASE ONLY ONE PLAYER LOOK AT THE SCREEN!!</div>
            <button id="ok" onclick="okay()">Okay</button>
            <div id="finalcategory"></div>
            <div id="question"></div>
            <input id="finalanswer">
            <button id="finalsubmit" onclick="finalsubmit()"></button>
        </div>
        <div id="changerequest">
            <div id="change">Please look away and let other player play!!</div>
            <button id="changed" onclick="changed()"></button>
        </div>
        <script type="text/javascript" src="script.js" async defer></script>
    </body>
</html>
